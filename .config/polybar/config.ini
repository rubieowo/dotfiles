[colors]
background = #1b061c
background-alt = #373B41
foreground = #d1e4ff
secondary = #3A2E3D
alert = #A54242
disabled = #707880
light-purple = #f7c7fc
workspace-empty = #3e2645
workspace-active = #554452

[bar/mybar]
width = 150%
height = 35
radius = 1
bottom = true
; Font 0: Text and labels (Size 11)
font-0 = "Iosevka NF:style=Regular:size=12.5;3"
; Font 1:
font-1 = "Noto Sans CJK JP:style=Regular:size=12.5;3"
; Font 2:
font-2 = "Iosevka NF:style=Bold:size=12.5;3"

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0
border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1


modules-left = left-gap left-text xwindow xworkspaces
modules-right = pulseaudio spotify
modules-center = date weather

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/left-gap]
type = custom/text
content = "  "
content-background = ${colors.background}

[module/left-text]
type = custom/text
label  = "何も考えないのって大好き"
format-background = #ff9ee7
format-foreground = #000000
label-padding-left = 2
label-padding-right = 2
label-font = 2

[module/xworkspaces]
type = internal/xworkspaces

icon-0 = one;1
icon-1 = two;2
icon-2 = three;3
icon-3 = four;4
icon-4 = five;
icon-5 = six;
icon-6 = seven;
icon-7 = eight;
icon-8 = nine;
icon-9 = nogroup;
icon-default = 0

label-active-foreground = ${colors.foreground}
label-active-background = #554452
label-active-underline= ${colors.primary}
label-active = %icon%
label-active-padding-left = 1
label-active-padding-right = 1
label-active-margin-right = 1

label-occupied = %icon%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding-left = 1
label-occupied-padding-right = 1
label-occupied-margin-right = 1

label-urgent = %icon%
label-urgent-background = ${colors.alert}
label-urgent-padding = 0

label-empty = %icon%
label-empty-foreground = ${colors.foreground}
label-empty-padding-left = 1
label-empty-padding-right = 1
label-empty-margin-right = 1


label-active-font = 1
label-occupied-font = 1
label-empty-font = 1

enable-scroll = true
reverse-scroll = true

[module/xwindow]
type = internal/xwindow
label = "%{F#ffffff}│  %{F#e3c7fc}ruby - %class%%{F#ffffff}  │%{F-}"
label-empty = ruby
label-padding-left = 2
label-padding-right = 2
label-font = 0

[module/fileystem]
type = internal/fs
interval = 25
mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.drimary}isabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>

label-volume = %percentage%%│

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/spotify]
type = custom/script
exec = ~/.config/polybar/scripts/spotify.sh
interval = 1

format = <label>
format-foreground = ${colors.foreground}
format-padding = ffffff
format-margin-right = 20px


click-left = playerctrl -p spotify play-pause
click-right = playerctl -p spotify next
scroll-up = playerctl -p spotify position 5+
scroll-down = playerctl -p spotify position 5-

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date% │
label-foreground = ${colors.light-purple}
format-padding = 0
label-padding = 0

[module/weather]
type = custom/script

exec = curl -s "wttr.in/Tbilisi?format=%t" | tr -d '+' | xargs 

interval = 1800
label = "%{O-6}%output%"
format = <label>
format-foreground = #{colors.foreground}
format-padding = 0

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
